name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version and the latest stable release. These names
        # are required checks on main, so changing them means updating the
        # repository ruleset too.
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # The fixtures are the end-to-end check: the tester must pass a correct
      # backend and must actually detect the four violation classes in the
      # deliberately vulnerable one. A tester that never fails is worthless.
      - name: Secure fixture must pass (exit 0)
        run: |
          python retrieval_scope_tester.py \
            --plan examples/test_plan.json \
            --fixture examples/fixture_secure.json

      - name: Vulnerable fixture must be detected (exit 2)
        run: |
          set +e
          python retrieval_scope_tester.py \
            --plan examples/test_plan.json \
            --fixture examples/fixture_vulnerable.json
          code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
